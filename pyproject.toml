[project]
name = "runwatch"
version = "0.1.0"
description = "A small job run tracker with alerts and a responder agent"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app/runwatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = [".venv", "frontend", "_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
