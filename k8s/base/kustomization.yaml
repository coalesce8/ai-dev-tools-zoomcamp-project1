apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# No namespace here: each overlay sets it.
resources:
  - postgres.yaml
  - api.yaml
  - worker.yaml
  - loadgen.yaml
  - frontend.yaml
  - otel-collector.yaml
  - agent.yaml
  - ingress.yaml
configMapGenerator:
  - name: otel-collector-config
    files:
      - config.yaml=otel-collector-config.yaml
# Tags are set by the overlays.
images:
  - name: ghcr.io/coalesce8/runwatch-app
  - name: ghcr.io/coalesce8/runwatch-frontend
