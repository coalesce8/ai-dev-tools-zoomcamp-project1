apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  labels: &labels
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: runwatch
spec:
  selector: *labels
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels: &labels
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/part-of: runwatch
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          imagePullPolicy: IfNotPresent
          args: ["--config=/etc/otelcol/config.yaml"]
          ports:
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
          # DEPLOYMENT_ENV is set by each overlay.
          env:
            # About 80% of the 320Mi limit, so the Go GC works before the cgroup limit bites.
            - name: GOMEMLIMIT
              value: 256MiB
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              memory: 320Mi
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
