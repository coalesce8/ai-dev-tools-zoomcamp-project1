apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
  labels: &labels
    app.kubernetes.io/name: loadgen
    app.kubernetes.io/part-of: runwatch
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      containers:
        - name: loadgen
          image: ghcr.io/coalesce8/runwatch-app
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "runwatch.loadgen"]
          env:
            - name: RUNWATCH_API_URL
              value: http://api:8000
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 48Mi
            limits:
              memory: 96Mi
