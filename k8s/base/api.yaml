apiVersion: v1
kind: Service
metadata:
  name: api
  labels: &labels
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: runwatch
spec:
  selector: *labels
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: &labels
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: runwatch
spec:
  # One replica on purpose: the migrate init container is the only migrator.
  # Scaling the API needs the migration moved to a Job first.
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels: *labels
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      initContainers:
        - name: migrate
          image: ghcr.io/coalesce8/runwatch-app
          imagePullPolicy: IfNotPresent
          command: ["alembic", "upgrade", "head"]
          env: &dbenv
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/runwatch
          securityContext: &sec
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 192Mi
      containers:
        - name: api
          image: ghcr.io/coalesce8/runwatch-app
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "--factory", "runwatch.api.app:create_app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
            - name: DATABASE_URL
              value: postgresql+psycopg://postgres:$(POSTGRES_PASSWORD)@postgres:5432/runwatch
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # Not /readyz: that checks the database, and a database outage must not restart the API.
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          securityContext: *sec
          resources:
            requests:
              cpu: 100m
              memory: 96Mi
            limits:
              memory: 192Mi
